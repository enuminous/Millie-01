name: Simulation and safety tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Simulation smoke tests
        run: |
          python -m millie01 demo --scenario clear --steps 20 > /dev/null
          python -m millie01 matrix --steps 20 --out /tmp/millie01-matrix.json
      - name: Browser simulation unit tests
        run: node --test tests/web_sim.test.mjs
      - name: Browser benchmark reproduction
        run: node benchmarks/run_web.mjs /tmp/millie01-web-benchmark.json
